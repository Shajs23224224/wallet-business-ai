<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Business AI</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(860px, calc(100% - 32px)); margin: 40px auto; }
    .grid { display: grid; gap: 20px; }
    .card {
      background: #fff;
      border: 1px solid #e4e8ee;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(22, 34, 51, .08);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p { color: #667085; line-height: 1.5; }
    form { display: grid; gap: 14px; margin-top: 18px; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input, select {
      width: 100%; border: 1px solid #cfd6df; border-radius: 10px;
      padding: 12px 13px; font: inherit; background: #fff;
    }
    button {
      border: 0; border-radius: 10px; padding: 13px 16px; font: inherit;
      font-weight: 700; cursor: pointer; background: #172033; color: #fff;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      margin-top: 20px; padding: 16px; border-radius: 12px;
      background: #f0f4f8; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .wallet-link { display: inline-block; margin-top: 12px; font-weight: 700; }
    .muted { font-size: 13px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="grid">
    <section class="card">
      <h1>Wallet Business AI</h1>
      <p>Administración multiempresa de programas de fidelización conectados con Google Wallet.</p>
      <button id="logout" type="button" hidden>Cerrar sesión</button>
    </section>

    <section class="card" id="auth-card">
      <h2>Acceso</h2>
      <form id="auth-form">
        <label>Correo<input name="email" type="email" required autocomplete="email"></label>
        <label>Contraseña<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
        <div class="row">
          <button id="login-button" type="submit">Iniciar sesión</button>
          <button id="register-button" type="button">Crear cuenta</button>
        </div>
      </form>
    </section>

    <section class="card app-card" hidden>
      <h2>Negocio</h2>
      <p>Selecciona un negocio existente o crea uno nuevo.</p>

      <label>
        Negocio
        <select id="business-select"></select>
      </label>

      <form id="business-form">
        <div class="row">
          <label>
            Nombre del negocio
            <input name="name" required maxlength="120" placeholder="Mi Negocio">
          </label>
          <label>
            Nombre del programa
            <input name="programName" maxlength="120" placeholder="Club de Clientes">
          </label>
        </div>

        <label>
          Logo HTTPS
          <input name="logoUrl" type="url" required placeholder="https://ejemplo.com/logo.png">
        </label>

        <button type="submit">Crear negocio</button>
      </form>
    </section>

    <section class="card app-card" hidden>
      <h2>Crear tarjeta</h2>
      <form id="loyalty-form">
        <div class="row">
          <label>
            ID del cliente
            <input name="id" required pattern="[A-Za-z0-9_-]+" maxlength="64" placeholder="cliente-001">
          </label>
          <label>
            Nombre
            <input name="name" required maxlength="120" placeholder="Cliente Demo">
          </label>
        </div>

        <label>
          Puntos iniciales
          <input name="points" type="number" min="0" step="1" value="0">
        </label>

        <button id="submit" type="submit">Crear tarjeta</button>
      </form>
    </section>

    <section class="card app-card" hidden>
      <h2>Actualizar puntos</h2>
      <form id="points-form">
        <div class="row">
          <label>
            ID del cliente
            <input name="id" required pattern="[A-Za-z0-9_-]+" maxlength="64" placeholder="cliente-001">
          </label>
          <label>
            Nuevos puntos
            <input name="points" type="number" min="0" step="1" value="0">
          </label>
        </div>

        <button type="submit">Actualizar puntos</button>
      </form>
    </section>

    <section class="card">
      <h2>Resultado</h2>
      <div id="result">Listo.</div>
      <p class="muted">Las credenciales privadas de Google Wallet permanecen en el servidor.</p>
    </section>
  </main>

  <script>
    const API = "/api/v1";
    const authCard = document.getElementById("auth-card");
    const authForm = document.getElementById("auth-form");
    const loginButton = document.getElementById("login-button");
    const registerButton = document.getElementById("register-button");
    const logout = document.getElementById("logout");
    const appCards = [...document.querySelectorAll(".app-card")];
    const tokenKey = "wallet_business_ai_token";

    const businessSelect = document.getElementById("business-select");
    const businessForm = document.getElementById("business-form");
    const loyaltyForm = document.getElementById("loyalty-form");
    const pointsForm = document.getElementById("points-form");
    const submitButton = document.getElementById("submit");
    const result = document.getElementById("result");

    function selectedBusinessId() {
      return businessSelect.value;
    }

    function token() {
      return localStorage.getItem(tokenKey);
    }

    function setAuthenticated(value) {
      authCard.hidden = value;
      logout.hidden = !value;
      for (const card of appCards) card.hidden = !value;
    }

    function authHeaders(extra = {}) {
      const current = token();
      return current
        ? { ...extra, Authorization: `Bearer ${current}` }
        : extra;
    }

    async function apiFetch(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: authHeaders({
          "Content-Type": "application/json",
          ...(options.headers || {})
        })
      });

      if (response.status === 401) {
        localStorage.removeItem(tokenKey);
        setAuthenticated(false);
      }

      return response;
    }

    function showResult(message) {
      result.hidden = false;
      result.textContent = message;
    }

    async function loadBusinesses() {
      const response = await apiFetch("/businesses");
      const body = await response.json();

      if (!response.ok) {
        throw new Error(body.error || "No se pudieron cargar los negocios.");
      }

      businessSelect.innerHTML = "";
      for (const business of body.data) {
        const option = document.createElement("option");
        option.value = business.id;
        option.textContent = business.name;
        businessSelect.appendChild(option);
      }
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      const data = Object.fromEntries(new FormData(authForm));
      try {
        const response = await fetch(API + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "No se pudo iniciar sesión.");
        localStorage.setItem(tokenKey, body.data.token);
        authForm.reset();
        setAuthenticated(true);
        await loadBusinesses();
        showResult("Sesión iniciada.");
      } catch (error) {
        showResult(error instanceof Error ? error.message : "Error inesperado.");
      } finally {
        loginButton.disabled = false;
      }
    });

    registerButton.addEventListener("click", async () => {
      const data = Object.fromEntries(new FormData(authForm));
      try {
        const response = await fetch(API + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "No se pudo crear la cuenta.");
        localStorage.setItem(tokenKey, body.data.token);
        authForm.reset();
        setAuthenticated(true);
        await loadBusinesses();
        showResult("Cuenta creada y sesión iniciada.");
      } catch (error) {
        showResult(error instanceof Error ? error.message : "Error inesperado.");
      }
    });

    logout.addEventListener("click", () => {
      localStorage.removeItem(tokenKey);
      setAuthenticated(false);
      businessSelect.innerHTML = "";
      showResult("Sesión cerrada.");
    });

    businessForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(businessForm));

      try {
        const response = await apiFetch("/businesses", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ? JSON.stringify(body.error) : "No se pudo crear el negocio.");
        }

        await loadBusinesses();
        businessSelect.value = body.data.business.id;
        businessForm.reset();
        showResult("Negocio creado y Loyalty Class preparada.");
      } catch (error) {
        showResult(error instanceof Error ? error.message : "Error inesperado.");
      }
    });

    loyaltyForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!selectedBusinessId()) {
        showResult("Primero selecciona o crea un negocio.");
        return;
      }

      submitButton.disabled = true;
      const data = Object.fromEntries(new FormData(loyaltyForm));
      data.points = Number(data.points || 0);

      try {
        const response = await apiFetch(
          `/businesses/${encodeURIComponent(selectedBusinessId())}/loyalty`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          }
        );

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ? JSON.stringify(body.error) : "No se pudo crear la tarjeta.");
        }

        result.innerHTML = "";
        const status = document.createElement("div");
        status.textContent = "Tarjeta creada correctamente.";

        const link = document.createElement("a");
        link.className = "wallet-link";
        link.href = body.addToWalletUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Añadir a Google Wallet";

        result.append(status, link);
      } catch (error) {
        showResult(error instanceof Error ? error.message : "Error inesperado.");
      } finally {
        submitButton.disabled = false;
      }
    });

    pointsForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!selectedBusinessId()) {
        showResult("Primero selecciona o crea un negocio.");
        return;
      }

      const data = Object.fromEntries(new FormData(pointsForm));
      data.points = Number(data.points || 0);

      try {
        const response = await apiFetch(
          `/businesses/${encodeURIComponent(selectedBusinessId())}/loyalty/${encodeURIComponent(data.id)}/points`,
          {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ points: data.points })
          }
        );

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ? JSON.stringify(body.error) : "No se pudieron actualizar los puntos.");
        }

        showResult("Puntos actualizados correctamente.");
      } catch (error) {
        showResult(error instanceof Error ? error.message : "Error inesperado.");
      }
    });

    if (token()) {
      setAuthenticated(true);
      loadBusinesses().catch((error) => {
        showResult(error instanceof Error ? error.message : "No se pudieron cargar los negocios.");
      });
    } else {
      setAuthenticated(false);
      showResult("Inicia sesión para comenzar.");
    }
  </script>
</body>
</html>
