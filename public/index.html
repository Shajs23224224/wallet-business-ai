<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Business AI</title>
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e8ee;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(22, 34, 51, .08);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { color: #667085; line-height: 1.5; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input {
      width: 100%;
      border: 1px solid #cfd6df;
      border-radius: 10px;
      padding: 12px 13px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #172033;
      color: #fff;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #f0f4f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    a.wallet-link {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      font-weight: 700;
    }
    .muted { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Wallet Business AI</h1>
      <p>Genera una tarjeta de fidelización y obtiene el enlace para añadirla a Google Wallet.</p>

      <form id="loyalty-form">
        <label>
          ID del cliente
          <input name="id" required pattern="[A-Za-z0-9_-]+" maxlength="64" placeholder="cliente-001">
        </label>

        <label>
          Nombre
          <input name="name" required maxlength="120" placeholder="Cliente Demo">
        </label>

        <label>
          Puntos iniciales
          <input name="points" type="number" min="0" step="1" value="0">
        </label>

        <button id="submit" type="submit">Crear tarjeta</button>
      </form>

      <div id="result" hidden></div>
      <p class="muted">El enlace de Google Wallet se genera en el servidor; las credenciales privadas nunca llegan al navegador.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById("loyalty-form");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.hidden = false;
      result.textContent = "Creando tarjeta...";

      const data = Object.fromEntries(new FormData(form));
      data.points = Number(data.points || 0);

      try {
        const response = await fetch("/api/wallet/loyalty", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ? JSON.stringify(body.error) : "No se pudo crear la tarjeta.");
        }

        result.innerHTML = "";
        const status = document.createElement("div");
        status.textContent = "Tarjeta creada correctamente.";

        const link = document.createElement("a");
        link.className = "wallet-link";
        link.href = body.addToWalletUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Añadir a Google Wallet";

        result.append(status, link);
      } catch (error) {
        result.textContent = error instanceof Error ? error.message : "Error inesperado.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
